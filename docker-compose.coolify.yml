# ==============================================================================
# ZeroStack - Stack per Coolify (build pack "Docker Compose", repo da GitHub)
# ==============================================================================
# In Coolify: Base Directory "/", Docker Compose Location "/docker-compose.coolify.yml".
# Dominio del servizio zerostack-web, nel pannello:
#   https://zerostack.it:3000,https://www.zerostack.it:3000
# I sottodomini degli autori e i loro domini personalizzati NON passano da qui:
# li serve il blocco on demand nel Caddyfile del proxy (dist/coolify-proxy.Caddyfile),
# che chiede a /api/domains/check prima di emettere ogni certificato.
#
# Password e segreti li genera Coolify (SERVICE_HEX_*): non vanno scritti da nessuna parte.
# Email: EMAIL_PROVIDER (brevo | resend | turbosmtp | smtp) e la chiave del provider, uguali per
# web (email di conferma) e worker (newsletter). Senza EMAIL_PROVIDER non parte nessuna email.
# Produzione: BACKUP_PASSPHRASE e BACKUP_S3_* (backup), ERROR_REPORTING_DSN (errori),
# ALERT_EMAIL (avvisi) e un monitor esterno su https://zerostack.it/api/health.
# ==============================================================================

# Variabili email in comune tra web e worker
x-email-env: &email-env
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
  EMAIL_FROM: ${EMAIL_FROM:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  TURBOSMTP_CONSUMER_KEY: ${TURBOSMTP_CONSUMER_KEY:-}
  TURBOSMTP_CONSUMER_SECRET: ${TURBOSMTP_CONSUMER_SECRET:-}
  TURBOSMTP_API_BASE: ${TURBOSMTP_API_BASE:-https://api.eu.turbo-smtp.com/api/v2}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}

# Segnalazione degli errori (Sentry o GlitchTip), uguale per tutti i servizi
x-monitoring-env: &monitoring-env
  ERROR_REPORTING_DSN: ${ERROR_REPORTING_DSN:-}
  ALERT_EMAIL: ${ALERT_EMAIL:-}

services:
  # Migrazioni del database (packages/database/prisma/migrations): girano a ogni deploy e poi
  # il servizio esce. Se falliscono il web non parte: meglio un deploy fermo che un sito rotto.
  zerostack-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["node", "packages/database/scripts/migrate.mjs"]
    restart: "no"
    exclude_from_hc: true
    environment:
      - DATABASE_URL=postgresql://zerostack:${SERVICE_HEX_32_POSTGRES}@zerostack-postgres:5432/zerostack?schema=public
    depends_on:
      zerostack-postgres:
        condition: service_healthy

  zerostack-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      <<: [*email-env, *monitoring-env]
      NODE_ENV: production
      DATABASE_URL: postgresql://zerostack:${SERVICE_HEX_32_POSTGRES}@zerostack-postgres:5432/zerostack?schema=public
      REDIS_URL: redis://zerostack-redis:6379
      # /api/health risponde 503 anche se l'ultimo backup è vecchio di più di BACKUP_MAX_AGE_HOURS
      HEALTH_REQUIRE_BACKUP: ${HEALTH_REQUIRE_BACKUP:-true}
      APP_DOMAIN: ${APP_DOMAIN:-zerostack.it}
      APP_URL: ${APP_URL:-https://zerostack.it}
      NEXT_PUBLIC_ROOT_DOMAIN: ${APP_DOMAIN:-zerostack.it}
      NEXTAUTH_URL: ${APP_URL:-https://zerostack.it}
      NEXTAUTH_SECRET: ${SERVICE_HEX_64_NEXTAUTH}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-}
      LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      # Data di "ultimo aggiornamento" delle pagine legali (es. "1 ottobre 2026")
      LEGAL_UPDATED_AT: ${LEGAL_UPDATED_AT:-}
      SDI_ID_TRASMITTENTE: ${SDI_ID_TRASMITTENTE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      EMAIL_WEBHOOK_TOKEN: ${EMAIL_WEBHOOK_TOKEN:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    volumes:
      - zerostack-uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      zerostack-migrate:
        condition: service_completed_successfully
      zerostack-redis:
        condition: service_healthy

  # Newsletter e post programmati: legge le campagne dal database e le spedisce.
  zerostack-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    exclude_from_hc: true
    environment:
      <<: [*email-env, *monitoring-env]
      NODE_ENV: production
      DATABASE_URL: postgresql://zerostack:${SERVICE_HEX_32_POSTGRES}@zerostack-postgres:5432/zerostack?schema=public
      APP_DOMAIN: ${APP_DOMAIN:-zerostack.it}
      APP_URL: ${APP_URL:-https://zerostack.it}
      EMAIL_RATE_PER_SECOND: ${EMAIL_RATE_PER_SECOND:-10}
    depends_on:
      zerostack-migrate:
        condition: service_completed_successfully

  # Backup giornaliero di database e file caricati, cifrato e copiato su uno storage S3 esterno.
  # Senza BACKUP_S3_BUCKET resta solo sul volume del server: non protegge da un server perso.
  zerostack-backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["npm", "run", "backup", "--workspace=@zerostack/worker", "--", "--loop"]
    restart: unless-stopped
    exclude_from_hc: true
    environment:
      <<: [*email-env, *monitoring-env]
      NODE_ENV: production
      DATABASE_URL: postgresql://zerostack:${SERVICE_HEX_32_POSTGRES}@zerostack-postgres:5432/zerostack?schema=public
      APP_DOMAIN: ${APP_DOMAIN:-zerostack.it}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-zerostack/}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - zerostack-uploads:/data/uploads:ro
      - zerostack-backups:/backups
    depends_on:
      zerostack-migrate:
        condition: service_completed_successfully

  zerostack-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zerostack
      - POSTGRES_PASSWORD=${SERVICE_HEX_32_POSTGRES}
      - POSTGRES_DB=zerostack
    volumes:
      - zerostack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerostack -d zerostack"]
      interval: 5s
      timeout: 5s
      retries: 10

  zerostack-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - zerostack-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zerostack-backups:
  zerostack-uploads:
  zerostack-pgdata:
  zerostack-redisdata:
