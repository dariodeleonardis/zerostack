version: '3.8'

services:
  # Web Application (Next.js 15 Standalone)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zerostack}:${POSTGRES_PASSWORD:-zerostack_secret}@postgres:5432/${POSTGRES_DB:-zerostack}?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super_secret_zerostack_jwt_key_2026}
      - NEXTAUTH_URL=${APP_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - zerostack-net

  # Asynchronous Background Worker (Email Blasts, BullMQ, Podcast Transcripts)
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zerostack}:${POSTGRES_PASSWORD:-zerostack_secret}@postgres:5432/${POSTGRES_DB:-zerostack}?schema=public
      - REDIS_URL=redis://redis:6379
      - BREVO_API_KEY=${BREVO_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - zerostack-net

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerostack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerostack_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zerostack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zerostack-net

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - zerostack-net

  # Caddy Reverse Proxy (Automatic Let's Encrypt SSL & On-Demand Custom Domains)
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - zerostack-net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  zerostack-net:
    driver: bridge
